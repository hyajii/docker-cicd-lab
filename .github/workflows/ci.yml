name: CI

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - main


    pull_request:
        branches:
            - main

jobs:

    test:
        name: Testes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Executar testes
              run: npm test

    docker-build:
        name: Docker Build e Push
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login no GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build da imagem
              run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

            - name: Push da imagem
              if: github.event_name == 'push'
              run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

    deploy:
        name: Deploy Production
        runs-on: self-hosted
        needs: docker-build

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        environment:
            name: production

        steps:
            - name: Mostrar versão
              run: |
                echo "Commit: ${{ github.sha }}"
                echo "Imagem ghcr.io/${{ github.repository }}:${{ github.sha }}"

            - name: Guardar versão atual
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                CURRENT_TAG=$(grep '^IMAGE_TAG=' .env | cut -d'=' -f2)
                echo "Versão atualmente em produção: $CURRENT_TAG"
                echo "PREVIOUS_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

            - name: Atualizar versão
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env
                grep "^IMAGE_TAG=" .env

            - name: Baixar nova imagem
              working-directory: /home/hyaji/labs/deploy/producao
              run: docker compose pull api

            - name: Atualizar aplicação
              working-directory: /home/hyaji/labs/deploy/producao
              run: docker compose up -d api

            - name: Smoke teste
              id: smoke-test
              continue-on-error: true
              run: |
                for i in {1..10}; do
                  if curl --fail --silent http://localhost:8080/health; then
                    echo
                    echo "Aplicação saudável"
                    exit 0
                  fi

                  echo "Tentativa $i/10 falhou. Aguardando..."
                  sleep 2
                done

                echo "Aplicação não ficou disponível a tempo"
                exit 1

            - name: Rollback
              if: steps.smoke-test.outcome == 'failure'
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                echo "Smoke test falhou."
                echo "Voltando para: $PREVIOUS_TAG"

                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$PREVIOUS_TAG/" .env

                docker compose up -d api

            - name: Validar rollback
              if: steps.smoke-test.outcome == 'failure'
              run: |
                for i in {1..10}; do
                  if curl --fail --silent http://localhost:8080/health; then
                    echo
                    echo "Rollback concluído e aplicação saudável"
                    exit 0
                  fi

                  echo "Aguardando versão anterior..."
                  sleep 2
                done

                echo "ERRO: rollback não recuperou a aplicação"
                exit 1

            - name: Marcar deployment como falha
              if: steps.smoke-test.outcome == 'failure'
              run: |
                echo "A nova versão falhou e foi realizado rollback"
                exit 1
