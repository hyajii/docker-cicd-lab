name: CI

on:
    push:
        branches:
            - main


    pull_request:
        branches:
            - main

jobs:

    test:
        name: Testes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            -name: Executar testes
             run: npm test

    docker-build:
        name: Docker Build
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build da imagem
              run: docker build -t minha-api:${{ github.sha }} .
