name: CI

permissions:
    contents: read
    packages: write

on:
    push:
        branches:
            - main


    pull_request:
        branches:
            - main

jobs:

    test:
        name: Testes
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Executar testes
              run: npm test

    docker-build:
        name: Docker Build e Push
        runs-on: ubuntu-latest
        needs: test

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login no GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build da imagem
              run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

            - name: Push da imagem
              if: github.event_name == 'push'
              run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

    deploy:
        name: Deploy Production Blue Green
        runs-on: self-hosted
        needs: docker-build

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        environment:
            name: production

        steps:
            - name: Mostrar versão
              run: |
                echo "Commit: ${{ github.sha }}"
                echo "Imagem ghcr.io/${{ github.repository }}:${{ github.sha }}"

            - name: Descobrir slots
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                ACTIVE=$(cat active-slot)

                if [ "$ACTIVE" = "blue" ]; then
                  INACTIVE="green"
                  PORT="3002"
                else
                  INACTIVE="blue"
                  PORT="3001"
                fi

                echo "ACTIVE_SLOT=$ACTIVE" >> "$GITHUB_ENV"
                echo "INACTIVE_SLOT=$INACTIVE" >> "$GITHUB_ENV"
                echo "INACTIVE_PORT=$PORT" >> "$GITHUB_ENV"

                echo "Ativo: $ACTIVE"
                echo "Depoly será feito em: $INACTIVE"

            - name: Configurar nova versão
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                if [ "$INACTIVE_SLOT" = "blue" ]; then
                  sed -i "s/^BLUE_TAG=.*/BLUE_TAG=${{ github.sha }}/" .env
                else
                  sed -i "s/^GREEN_TAG=.*/GREEN_TAG=${{ github.sha }}/" .env
                fi

                grep "_TAG=" .env

            - name: Deploy no slot inativo
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                docker compose pull api-$INACTIVE_SLOT
                docker compose up -d api-$INACTIVE_SLOT

            - name: Smoke test candidato
              id: smoke-test
              run: |
                for i in {1..10}; do
                  if curl --fail --silent http://localhost:$INACTIVE_PORT/health; then
                    echo
                    echo "$INACTIVE_SLOT está saudável"
                    exit 0
                  fi

                  echo "Tentativa $i/10 falhou"
                  sleep 2
                done

                echo "$INACTIVE_SLOT não ficou saudável"
                exit 1

            - name: Promover candidato
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                ./switch-slot.sh "$INACTIVE_SLOT"

            - name: Validar produção
              id: production-check
              continue-on-error: true
              run: |
                for i in {1..5}; do
                  if curl --fail --silent http://localhost:8080/health; then
                    echo
                    echo "Produção saudável"
                    exit 0
                  fi

                  echo "Tentativa $i/5 falhou"
                  sleep 2
                done

                echo "Produção falhou após o switch"
                exit 1

            - name: Rollback de tráfego
              if: steps.production-check.outcome == 'failure'
              working-directory: /home/hyaji/labs/deploy/producao
              run: |
                echo "Nova versão falhou após promoção."
                echo "Retornando tráfego para $ACTIVE_SLOT"

                ./switch-slot.sh "$ACTIVE_SLOT"

            - name: Validar rollback
              if: steps.production-check.outcome == 'failure'
              run: |
                for i in {1..5}; do
                  if curl --fail --silent http://localhost:8080/health; then
                    echo
                    echo "Rollback concluído. Produção saudável em $ACTIVE_SLOT"
                    exit 0
                  fi

                  echo "Tentativa de recuperação $i/5 falhou"
                  sleep 2
                done

                echo "ERRO: rollback não recuperou produção"
                exit 1

            - name: Marcar deployment como falha
              if: steps.production-check.outcome == 'failure'
              run: |
                echo "Deployment falhou após promoção e foi revertido para $ACTIVE_SLOT."
                exit 1
